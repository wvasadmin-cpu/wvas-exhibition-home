<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exhibition — Welland Valley Art Society</title>
  <meta name="description" content="Welland Valley Art Society exhibitions at Stamford Arts Centre: enter, steward, browse the catalogue and meet the artists." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green-dark: #2c4a3e; --green-mid: #3d6b5a; --cream: #f7f3ee; --cream-dark: #ede8e0;
      --text: #2a2218; --text-mid: #5a4a3a; --text-light: #8a7a6a; --rule: #d8d0c4;
      /* Seasonal accent: set from the exhibition title (Spring / Autumn) */
      --accent: #c8a96e; --accent-ink: #5c4a20; --accent-tint: #f4ecdc;
    }
    body.spring { --accent: #d98ca0; --accent-ink: #6e2f40; --accent-tint: #f6e1e6; }
    body { background: var(--cream); font-family: 'Source Sans 3', sans-serif; color: var(--text); font-size: 16px; line-height: 1.6; }
    a { color: var(--green-dark); }

    #site-header { background: var(--green-dark); border-bottom: 4px solid var(--accent); padding: 18px 24px; }
    #site-header .inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 16px; }
    #site-header img { width: 56px; height: 56px; object-fit: contain; background: #fff; padding: 4px; flex-shrink: 0; }
    #site-header .eyebrow { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
    #site-header .name { font-family: 'Playfair Display', serif; font-size: 19px; color: var(--cream); }

    main { max-width: 760px; margin: 0 auto; padding: 28px 20px 48px; }
    .pill { display: inline-block; font-size: 14px; font-weight: 600; padding: 4px 12px; border-radius: 20px; background: var(--accent-tint); color: var(--accent-ink); }
    h1 { font-family: 'Playfair Display', serif; font-weight: 400; font-size: clamp(28px, 6vw, 38px); color: var(--green-dark); line-height: 1.2; margin: 10px 0 4px; }
    .venue { font-size: 16px; color: var(--text-mid); margin-bottom: 22px; }

    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px; }
    .card { display: block; background: #fff; border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; text-decoration: none; color: inherit; transition: border-color .15s; }
    a.card:hover, a.card:focus-visible { border-color: var(--green-mid); }
    .card.lead { border: 2px solid var(--accent); }
    .card.muted { background: var(--cream-dark); }
    .card b { display: block; font-family: 'Playfair Display', serif; font-weight: 400; font-size: 20px; color: var(--green-dark); margin-bottom: 2px; }
    .card span { font-size: 14px; color: var(--text-mid); }
    .card.ext b::after { content: ' ↗'; font-family: 'Source Sans 3', sans-serif; font-size: 15px; color: var(--text-light); }

    .panel { background: #fff; border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; margin-bottom: 22px; }
    .panel h2 { font-family: 'Playfair Display', serif; font-weight: 400; font-size: 20px; color: var(--green-dark); margin-bottom: 8px; }
    .panel p { font-size: 15px; color: var(--text-mid); margin-bottom: 8px; }
    .panel p:last-child { margin-bottom: 0; }
    .panel ul { margin: 4px 0 10px 20px; font-size: 15px; color: var(--text-mid); }
    .dates { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 18px; font-size: 14px; color: var(--text-mid); }
    .dates strong { display: block; color: var(--text); font-weight: 600; }
    .links { font-size: 15px; }
    .hall { width: 100%; height: auto; display: block; border: 1px solid var(--rule); border-radius: 10px; margin-bottom: 22px; }

    footer { border-top: 4px solid var(--accent); padding: 14px 20px; }
    footer .inner { max-width: 760px; margin: 0 auto; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 14px; color: var(--text-mid); }
    footer a { color: var(--text-mid); }

    /* Members-only gate for ?for=exhibitors */
    .gate form { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .gate input { flex: 1 1 200px; font: inherit; font-size: 16px; padding: 9px 12px; border: 1px solid var(--rule); border-radius: 8px; }
    .gate button { font: inherit; font-size: 16px; font-weight: 600; padding: 9px 18px; border: 0; border-radius: 8px; background: var(--green-dark); color: #fff; cursor: pointer; }
    .gate .wrong { color: #a23b2a; font-weight: 600; margin-top: 8px; }

    /* Exhibitor page extras */
    .welcome { font-size: 17px; color: var(--text); margin: -8px 0 20px; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .countdown { font-size: 14px; font-weight: 600; color: var(--accent-ink); background: var(--accent-tint); padding: 2px 10px; border-radius: 12px; }
    .timeline { list-style: none; margin-top: 6px; }
    .timeline li { position: relative; padding: 0 0 12px 28px; font-size: 15px; color: var(--text-mid); }
    .timeline li::before { content: ''; position: absolute; left: 5px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid var(--rule); box-sizing: border-box; }
    .timeline li::after { content: ''; position: absolute; left: 10px; top: 20px; bottom: -4px; width: 2px; background: var(--rule); }
    .timeline li:last-child { padding-bottom: 0; }
    .timeline li:last-child::after { display: none; }
    .timeline li strong { color: var(--text); font-weight: 600; margin-right: 6px; }
    .timeline li.done { color: var(--text-light); }
    .timeline li.done strong { color: var(--text-light); }
    .timeline li.done::before { background: var(--green-mid); border-color: var(--green-mid); }
    .timeline li.now::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-tint); }
    .timeline .here { font-size: 12px; font-weight: 600; background: var(--accent-tint); color: var(--accent-ink); padding: 1px 8px; border-radius: 10px; margin-left: 6px; white-space: nowrap; }
    .glance li { margin-bottom: 4px; }
    .contact { border-left: 4px solid var(--accent); }

    /* Portrait video beside the text panels (general page); stacks below them on phones */
    .with-video { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 22px; margin-bottom: 22px; }
    /* the last text panel stretches so its bottom edge lines up with the video's */
    .with-video > div:first-child { display: flex; flex-direction: column; }
    .with-video .panel:last-child { margin-bottom: 0; flex: 1; }
    .clip-wrap { position: relative; align-self: start; }
    .clip { width: 100%; aspect-ratio: 9 / 16; display: block; object-fit: cover; background: var(--cream-dark); border: 1px solid var(--rule); border-radius: 10px; }
    .clip-btn { position: absolute; right: 10px; bottom: 10px; width: 36px; height: 36px; border: 0; border-radius: 50%; background: rgba(42, 34, 24, .6); color: #fff; font-size: 14px; line-height: 36px; cursor: pointer; }
    .clip-btn:hover, .clip-btn:focus-visible { background: rgba(42, 34, 24, .85); }

    #loading { color: var(--text-light); font-size: 15px; }
    @media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }
    @media (max-width: 640px) {
      .with-video { grid-template-columns: 1fr; }
      .clip-wrap { width: 100%; max-width: 280px; margin: 0 auto; }
    }
  </style>
</head>
<body>

<header id="site-header">
  <div class="inner">
    <img src="/wvas-logo.jpg" alt="WVAS logo" />
    <div>
      <div class="eyebrow">Welland Valley Art Society</div>
      <div class="name" id="header-name">Exhibitions</div>
    </div>
  </div>
</header>

<main id="page">
  <p id="loading">Loading…</p>
</main>

<footer>
  <div class="inner">
    <a href="https://www.wellandvalleyartsociety.co.uk/">Welland Valley Art Society website →</a>
    <span>Exhibition contact: <a href="mailto:wvas_exhibition@yahoo.com">wvas_exhibition@yahoo.com</a></span>
    <a href="/admin/">Exhibition Admin</a>
  </div>
</footer>

<script>
/* ============================================================
   LINKS — the only place the other sites' addresses live.
   (If a site ever moves, change its address here.)
   ============================================================ */
const LINKS = {
  enter:       'https://wvas-ex-entry.netlify.app/',
  howToEnter:  'https://wvas-ex-guide.netlify.app/',
  rotaBook:    'https://wvas-ex-rota.netlify.app/overview',
  rotaBooked:  'https://wvas-ex-rota.netlify.app/booked',
  profiles:    'https://wvas-ex-profiles.netlify.app/',
  catalogue:   'https://wvas-ex-catalogue.netlify.app/catalogue/',
  artists:     'https://wvas-ex-catalogue.netlify.app/profiles/',
  wvas:        'https://www.wellandvalleyartsociety.co.uk/',
  venue:       'https://www.stamfordartscentre.com/',
  map:         'https://www.google.com/maps/search/?api=1&query=Stamford+Arts+Centre%2C+27+St+Mary%27s+Street%2C+Stamford+PE9+2DL',
};
// Title, dates and the phase-switching dates are set on the entry form's settings page (/admin/).
const CONFIG_URL = 'https://wvas-ex-entry.netlify.app/.netlify/functions/config';

/* ---------- small helpers (everything from Config is inserted as text, never HTML) ---------- */
function el(tag, attrs, children) {
  const n = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (k === 'text') n.textContent = v; else if (k === 'class') n.className = v; else n.setAttribute(k, v);
  });
  (children || []).forEach((c) => c && n.appendChild(c));
  return n;
}
function card(title, sub, href, opts) {
  opts = opts || {};
  const cls = 'card' + (opts.lead ? ' lead' : '') + (href ? '' : ' muted') + (opts.newTab ? ' ext' : '');
  const attrs = href ? { class: cls, href: href } : { class: cls };
  // Artist phases open the other sites in a new tab, so this page stays open as the hub
  // (e.g. How to Enter beside the entry form). Visitors (mostly on phones) stay in the same tab.
  if (href && opts.newTab) { attrs.target = '_blank'; attrs.rel = 'noopener'; }
  return el(href ? 'a' : 'div', attrs, [el('b', { text: title }), el('span', { text: sub })]);
}
function datesPanel(title, rows) {
  const items = rows.filter(([, v]) => v).map(([label, v]) => el('div', {}, [el('strong', { text: v }), document.createTextNode(label)]));
  return items.length ? el('section', { class: 'panel' }, [el('h2', { text: title }), el('div', { class: 'dates' }, items)]) : null;
}
// Short muted looping clip from an exhibition opening (portrait, ~5 MB). It plays on its own
// unless the visitor has asked for reduced motion; the round button pauses / plays it.
function openingClip() {
  const v = document.createElement('video');
  v.className = 'clip';
  v.src = '/exhibition-opening.mp4';
  v.poster = '/exhibition-opening-poster.jpg';
  v.muted = true; v.defaultMuted = true; v.loop = true; v.playsInline = true;
  v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
  v.setAttribute('aria-label', 'Short video of artists and visitors at an exhibition opening');
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (still) v.preload = 'none'; else v.autoplay = true;
  const btn = el('button', { class: 'clip-btn', type: 'button' });
  const sync = () => {
    btn.textContent = v.paused ? '▶' : '❚❚';
    btn.setAttribute('aria-label', v.paused ? 'Play video' : 'Pause video');
  };
  v.addEventListener('play', sync); v.addEventListener('pause', sync);
  btn.addEventListener('click', () => (v.paused ? v.play() : v.pause()));
  sync();
  return el('div', { class: 'clip-wrap' }, [v, btn]);
}
// Text panels on the left, the video on the right
function withVideo(panels) {
  return el('div', { class: 'with-video' }, [el('div', {}, panels), openingClip()]);
}

function findUsPanel() {
  return el('section', { class: 'panel', id: 'find-us' }, [
    el('h2', { text: 'Find us' }),
    el('p', { text: "Stamford Arts Centre, 27 St Mary's Street, Stamford PE9 2DL. It runs parallel to the High Street, about a mile off the A1, and is a short walk from the train and bus stations." }),
    el('h2', { text: 'Parking', style: 'font-size:17px; margin-top:10px;' }),
    el('ul', {}, [
      el('li', { text: "Wharf Road car park, about 3 minutes' walk" }),
      el('li', { text: "Also Cattle Market, Bath Row, or St Leonard's Street (short stay)" }),
      el('li', { text: 'Free in town after 6pm' }),
      el('li', { text: "Blue Badge spaces on St Mary's Street and St George's Square" }),
    ]),
    el('p', { class: 'links' }, [
      el('a', { href: LINKS.map, text: 'Map ↗', target: '_blank', rel: 'noopener' }), document.createTextNode(' · '),
      el('a', { href: LINKS.venue, text: 'Arts Centre visitor information ↗', target: '_blank', rel: 'noopener' }),
    ]),
  ]);
}

/* ---------- which phase are we in? ---------- */
// Test any phase or day without changing the settings: ?phase=artists|closed|visitors|between|upcoming or ?date=2027-04-10
// (both work alongside ?for=exhibitors / ?for=visitors)
function todayIso() {
  const q = new URLSearchParams(location.search).get('date');
  if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) return q;
  const d = new Date();
  return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
}
function localIso(d) {
  return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
}
function phaseFor(c) {
  const forced = new URLSearchParams(location.search).get('phase');
  if (['artists', 'closed', 'visitors', 'between', 'upcoming'].includes(forced)) return forced;
  if (c.unavailable) return 'between';
  const today = todayIso();
  if (c.exhibitionOpensOn && c.exhibitionClosesOn && today >= c.exhibitionOpensOn && today <= c.exhibitionClosesOn) return 'visitors';
  if (c.exhibitionClosesOn && today > c.exhibitionClosesOn) return 'between';
  if (c.entryOpensOn && today < c.entryOpensOn) return 'upcoming';
  const closesAt = c.entryClosesAt ? new Date(c.entryClosesAt) : null;
  const now = new URLSearchParams(location.search).get('date') ? new Date(today + 'T12:00:00') : new Date();
  return closesAt && !isNaN(closesAt) && now >= closesAt ? 'closed' : 'artists';
}

/* ---------- render ---------- */
// Who the page is for: ?for=exhibitors (the members' page, password-gated) or ?for=visitors (general info)
// keep their audience all year and follow the dates within it. With neither, the page stays public:
// visitor info from entries opening to the exhibition closing, general info the rest of the year.
const FOR = new URLSearchParams(location.search).get('for');
function audienceFor(phase) {
  if (FOR === 'exhibitors' || FOR === 'visitors') return FOR;
  return phase === 'artists' || phase === 'closed' || phase === 'visitors' ? 'visitors' : 'general';
}

/* ---------- members-only gate (exhibitor page) ---------- */
// A polite gate, not real security: nothing on the exhibitor page is secret. The password is
// checked by netlify/functions/exhibitors.mjs and not remembered: it's asked for on every visit.
const GATE_URL = '/api/exhibitors';
let unlocked = false;
function gate(c) {
  const input = el('input', { type: 'password', id: 'gate-pw', autocomplete: 'current-password', 'aria-label': "Exhibitors' password", placeholder: "Exhibitors' password", required: '' });
  const wrong = el('p', { class: 'wrong', role: 'alert' });
  const form = el('form', {}, [input, el('button', { type: 'submit', text: 'Continue' })]);
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    wrong.textContent = '';
    fetch(GATE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: input.value }) })
      .then((r) => r.json())
      .then((j) => {
        if (j.ok) { unlocked = true; render(c); window.scrollTo(0, 0); }
        else { wrong.textContent = "That password isn't right. It's the same Exhibitors' password as on the society website."; input.select(); }
      })
      .catch(() => { wrong.textContent = "Couldn't check the password just now. Please try again in a moment."; });
  });
  const page = document.getElementById('page');
  page.replaceChildren(
    el('span', { class: 'pill', text: 'Members only' }),
    el('h1', { text: 'Exhibitor Information' }),
    el('section', { class: 'panel gate' }, [
      el('p', { text: "This page is for WVAS members exhibiting with us. Please enter the Exhibitors' password, the same one used on the society website." }),
      form, wrong,
    ]),
  );
  input.focus();
}

function render(c) {
  const title = (c.mainTitle || 'Exhibition').replace(/\s*[—–-]\s*Entry Form\s*$/i, '').trim();
  document.body.classList.toggle('spring', /spring/i.test(title));
  document.title = title + ' — Welland Valley Art Society';
  const phase = phaseFor(c);
  const audience = audienceFor(phase);
  if (audience === 'exhibitors' && !unlocked) {
    document.getElementById('header-name').textContent = 'Exhibitor Information';
    return gate(c);
  }
  // Header speaks to whoever the page is for
  document.getElementById('header-name').textContent =
    audience === 'exhibitors' ? 'Exhibitor Information'
    : audience === 'visitors' ? 'Exhibition Information'
    : 'Exhibitions';
  const venue = 'Stamford Arts Centre' + (c.exhibitionDates ? ' · ' + c.exhibitionDates : '');
  const venueTimes = 'Stamford Arts Centre' + (c.openingTimes ? ' · ' + c.openingTimes : '');
  const page = document.getElementById('page');
  page.replaceChildren();

  const hero = (pillText, heading, sub) => [
    pillText ? el('span', { class: 'pill', text: pillText }) : null,
    el('h1', { text: heading }),
    el('p', { class: 'venue', text: sub }),
  ];
  const add = (nodes) => nodes.forEach((n) => n && page.appendChild(n));
  const nextText = phase === 'upcoming'
    ? title + (c.entryOpens ? ' — entries open ' + c.entryOpens : '') + (c.exhibitionDates ? ', exhibition ' + c.exhibitionDates : '') + '.'
    : (c.nextExhibition || 'Details of our next exhibition will be announced here.');
  const nextPanel = () => el('section', { class: 'panel' }, [el('h2', { text: 'Next exhibition' }), el('p', { text: nextText })]);
  const aboutPanel = (withExhibitLine) => el('section', { class: 'panel' }, [
    el('h2', { text: 'Our exhibitions' }),
    el('p', { text: 'Twice a year, in spring and autumn, members of the Welland Valley Art Society show and sell their work at Stamford Arts Centre — paintings, drawings, prints, sculpture and more, all by local artists.' }),
    el('p', { text: 'Watch this space for more details and confirmed dates for entries and viewing.' }),
    withExhibitLine ? el('p', { text: 'Want to exhibit with us? Details are on the society website, linked below.' }) : null,
  ]);

  // ---- exhibitor page extras ----
  const EXHIBITION_EMAIL = 'wvas_exhibition@yahoo.com', MEMBERSEC_EMAIL = 'WVASMembersec@gmail.com';
  const welcome = (text) => el('p', { class: 'welcome', text: text });
  const hall = () => el('img', { class: 'hall', src: '/exhibition-hall.jpg', alt: 'A Welland Valley Art Society exhibition at Stamford Arts Centre' });
  const daysTo = (iso) => Math.round((new Date(iso + 'T12:00:00') - new Date(todayIso() + 'T12:00:00')) / 86400000);
  const when = (n) => (n <= 0 ? 'today' : n === 1 ? 'tomorrow' : 'in ' + n + ' days');
  const timeline = () => {
    const steps = [['Entries open', c.entryOpens], ['Entries close', c.entryCloses], ['Hand-in', c.handIn],
      ['Private view', c.privateView], ['Exhibition', c.exhibitionDates], ['Collection', c.collection]];
    // the step coming up next (or on now), by phase; everything before it is done
    const next = { upcoming: 0, artists: 1, closed: 2, visitors: 4 }[phase] ?? steps.length;
    let countdown = null;
    if (phase === 'upcoming' && c.entryOpensOn && daysTo(c.entryOpensOn) <= 60) countdown = 'Entries open ' + when(daysTo(c.entryOpensOn));
    if (phase === 'artists' && c.entryClosesAt) {
      const d = new Date(c.entryClosesAt);
      if (!isNaN(d)) countdown = 'Entries close ' + when(daysTo(localIso(d)));
    }
    if (phase === 'visitors' && c.exhibitionClosesOn) countdown = 'Exhibition closes ' + when(daysTo(c.exhibitionClosesOn));
    const items = steps.map(([label, v], i) => v && el('li', { class: i < next ? 'done' : i === next ? 'now' : '' }, [
      el('strong', { text: label }), document.createTextNode(v),
      i === next ? el('span', { class: 'here', text: phase === 'visitors' ? 'On now' : 'Next' }) : null,
    ]));
    return el('section', { class: 'panel' }, [
      el('div', { class: 'panel-head' }, [el('h2', { text: 'Key dates' }), countdown ? el('span', { class: 'countdown', text: countdown }) : null]),
      el('ol', { class: 'timeline' }, items),
    ]);
  };
  // The essentials only; the full rules stay on How to Enter.
  const glance = () => el('section', { class: 'panel' }, [
    el('h2', { text: 'At a glance' }),
    el('ul', { class: 'glance' }, [
      el('li', { text: 'Enter 2 to 4 works, plus an optional Small Affordable Work (priced £75 or less)' }),
      el('li', { text: '£10 entry fee, paid securely on the entry form' }),
      el('li', { text: 'Every exhibitor stewards at least 3 sessions during the exhibition' }),
      el('li', { text: 'Keep titles to about 40 characters so they fit on the labels' }),
    ]),
    el('p', { class: 'links' }, [el('a', { href: LINKS.howToEnter, text: 'Full guidelines and conditions of entry ↗', target: '_blank', rel: 'noopener' })]),
  ]);
  const contact = () => el('section', { class: 'panel contact' }, [
    el('h2', { text: 'Questions?' }),
    el('p', {}, [document.createTextNode('Email the exhibition team at '), el('a', { href: 'mailto:' + EXHIBITION_EMAIL, text: EXHIBITION_EMAIL }), document.createTextNode('.')]),
    phase === 'artists' || phase === 'closed'
      ? el('p', {}, [document.createTextNode('To change an entry after sending it, please tell the Membership Secretary at '), el('a', { href: 'mailto:' + MEMBERSEC_EMAIL, text: MEMBERSEC_EMAIL }), document.createTextNode('.')])
      : null,
  ]);

  if (audience === 'exhibitors') {
    if (phase === 'upcoming') {
      add(hero('Coming soon' + (c.entryOpens ? ' · entries open ' + c.entryOpens : ''), title, venue));
      add([welcome("We'd love to see your work on the walls" + (c.entryOpens ? ' — entries open on ' + c.entryOpens : '') +
        ". Have a read of How to Enter so you're ready, and check your artist profile is up to date."), hall(),
      el('div', { class: 'cards' }, [
        card('Enter the exhibition', c.entryOpens ? 'Entry form opens ' + c.entryOpens : 'Entry form opening soon', null),
        card('How to enter', 'Guidelines and conditions of entry', LINKS.howToEnter, { lead: true, newTab: true }),
        card('Artist profiles', 'Add or update yours', LINKS.profiles, { newTab: true }),
      ]), timeline(), glance(), contact()]);
    } else if (phase === 'artists') {
      add(hero(c.entryCloses ? 'Entries now open · closes ' + c.entryCloses : 'Entries now open', title, venue));
      add([welcome("Entries are open, and we'd love to see your work on the walls. Read How to Enter, send in your entry" +
        (c.entryCloses ? ' by ' + c.entryCloses : '') + ', and book your stewarding shifts while there\'s plenty of choice.'), hall(),
      el('div', { class: 'cards' }, [
        card('Enter the exhibition', 'Online entry form', LINKS.enter, { lead: true, newTab: true }),
        card('How to enter', 'Guidelines and conditions of entry', LINKS.howToEnter, { newTab: true }),
        card('Book a stewarding shift', 'Expected of all exhibitors', LINKS.rotaBook, { newTab: true }),
        card('Artist profiles', 'Add or update yours', LINKS.profiles, { newTab: true }),
      ]), timeline(), glance(), contact()]);
    } else if (phase === 'closed') {
      add(hero(c.handIn ? 'Entries closed · hand-in ' + c.handIn : 'Entries now closed', title, venue));
      add([welcome('Thank you for your entries! ' + (c.handIn ? 'Hand-in is ' + c.handIn + ' at Stamford Arts Centre. ' : '') +
        "If you haven't booked your stewarding shifts yet, now's the time."), hall(),
      el('div', { class: 'cards' }, [
        card('Book a stewarding shift', 'Expected of all exhibitors', LINKS.rotaBook, { lead: true, newTab: true }),
        card('Find us', 'Directions and parking for hand-in', '#find-us'),
        card('Entries are closed', 'Thank you to everyone who entered', null),
        card('Artist profiles', 'Add or update yours', LINKS.profiles, { newTab: true }),
      ]), timeline(), findUsPanel(), contact()]);
    } else if (phase === 'visitors') {
      add(hero('Exhibition open' + (c.exhibitionDates ? ' · ' + c.exhibitionDates : ''), title, venueTimes));
      add([welcome('The exhibition is open — thank you to everyone taking part. ' +
        (c.collection ? 'Please remember to collect unsold work on ' + c.collection + '.' : '')), hall(),
      el('div', { class: 'cards' }, [
        card('Stewards', 'Check your shift', LINKS.rotaBooked, { lead: true, newTab: true }),
        card('Find us', 'Directions and parking', '#find-us'),
        card('Browse the catalogue', 'See the exhibition online', LINKS.catalogue, { newTab: true }),
        card('Artist profiles', 'Add or update yours', LINKS.profiles, { newTab: true }),
      ]), timeline(), findUsPanel(), contact()]);
    } else {
      // after the exhibition, until the next one is set up in Settings
      add(hero('Thank you to everyone who exhibited', 'Exhibiting with us', 'Stamford Arts Centre'));
      add([welcome("Thank you for being part of this exhibition. Details of the next one will appear here as soon as they're set."), hall(),
      nextPanel(), el('div', { class: 'cards' }, [
        card('How to enter', 'Guidelines and conditions of entry', LINKS.howToEnter, { newTab: true }),
        card('Artist profiles', 'Add or update yours', LINKS.profiles, { newTab: true }),
      ]), contact()]);
    }
  } else if (audience === 'visitors' && (phase === 'upcoming' || phase === 'artists' || phase === 'closed')) {
    add(hero('Coming soon' + (c.exhibitionDates ? ' · ' + c.exhibitionDates : ''), title, venueTimes));
    add([el('div', { class: 'cards' }, [
      card('Find us', 'Directions, parking, Blue Badge spaces', '#find-us', { lead: true }),
      card('Meet the artists', 'Profiles and biographies', LINKS.artists),
    ]), datesPanel('Visit the exhibition', [['Exhibition', c.exhibitionDates], ['Private view', c.privateView], ['Opening times', c.openingTimes]]),
    findUsPanel()]);
  } else if (phase === 'visitors') {
    add(hero('Open now' + (c.exhibitionDates ? ' · ' + c.exhibitionDates : ''), title, venueTimes));
    add([el('div', { class: 'cards' }, [
      card('Browse the catalogue', 'Filter artists by name / view profiles', LINKS.catalogue, { lead: true }),
      card('Meet the artists', 'Profiles and biographies', LINKS.artists),
      card('Find us', 'Directions, parking, Blue Badge spaces', '#find-us'),
      card('Stewards', 'Check your shift', LINKS.rotaBooked),
    ]), findUsPanel()]);
  } else if (audience === 'visitors') {
    // after the exhibition, until the next one is set up in Settings
    add(hero('Thank you for visiting', 'Welland Valley Art Society exhibitions', 'Stamford Arts Centre'));
    add([
      el('img', { class: 'hall', src: '/exhibition-hall.jpg', alt: 'A Welland Valley Art Society exhibition at Stamford Arts Centre' }),
      withVideo([nextPanel(), aboutPanel(false)]),
    ]);
  } else {
    // 'between' (after an exhibition) or 'upcoming' (before entries open): content that doesn't date
    add(hero(phase === 'upcoming' ? 'Coming soon' : null, 'Welland Valley Art Society exhibitions', 'Stamford Arts Centre'));
    add([
      el('img', { class: 'hall', src: '/exhibition-hall.jpg', alt: 'A Welland Valley Art Society exhibition at Stamford Arts Centre' }),
      withVideo([nextPanel(), aboutPanel(true)]),
    ]);
  }
}

fetch(CONFIG_URL)
  .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
  .then(render)
  .catch(() => render({ unavailable: true })); // settings unavailable: show the plain "between exhibitions" page rather than nothing
</script>
</body>
</html>
